[versions]
agp                 = "9.2.1"
kotlin              = "2.2.10"
ksp                 = "2.2.10-2.0.2"
coreKtx             = "1.19.0"
activityCompose     = "1.13.0"
composeBom          = "2026.02.01"
lifecycle           = "2.11.0"
navigation          = "2.9.0"
hilt                = "2.59.2"
room                = "2.8.4"
paging              = "3.3.6"
datastore           = "1.1.3"
workmanager         = "2.11.2"
splashscreen        = "1.1.0-rc01"
vico                = "2.0.1"
flexibleBottomsheet = "0.3.0"
composeShimmer      = "1.3.2"
m3AdaptiveNavSuite  = "1.4.0-alpha01"
serializationJson   = "1.8.1"
junit               = "4.13.2"
junitVersion        = "1.3.0"
espressoCore        = "3.7.0"

[libraries]
androidx-core-ktx                       = { group = "androidx.core",              name = "core-ktx",                               version.ref = "coreKtx"           }
androidx-activity-compose               = { group = "androidx.activity",          name = "activity-compose",                       version.ref = "activityCompose"   }
androidx-compose-bom                    = { group = "androidx.compose",           name = "compose-bom",                            version.ref = "composeBom"        }
androidx-compose-ui                     = { group = "androidx.compose.ui",        name = "ui"                                                                        }
androidx-compose-ui-graphics            = { group = "androidx.compose.ui",        name = "ui-graphics"                                                               }
androidx-compose-ui-tooling             = { group = "androidx.compose.ui",        name = "ui-tooling"                                                                }
androidx-compose-ui-tooling-preview     = { group = "androidx.compose.ui",        name = "ui-tooling-preview"                                                        }
androidx-compose-ui-test-manifest       = { group = "androidx.compose.ui",        name = "ui-test-manifest"                                                          }
androidx-compose-ui-test-junit4         = { group = "androidx.compose.ui",        name = "ui-test-junit4"                                                            }
androidx-compose-material3              = { group = "androidx.compose.material3", name = "material3"                                                                 }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended"                                                   }
androidx-lifecycle-runtime-ktx          = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",                  version.ref = "lifecycle"         }
androidx-lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",            version.ref = "lifecycle"         }
androidx-lifecycle-runtime-compose      = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",              version.ref = "lifecycle"         }
androidx-navigation-compose             = { group = "androidx.navigation",        name = "navigation-compose",                     version.ref = "navigation"        }
kotlinx-serialization-json             = { group = "org.jetbrains.kotlinx",      name = "kotlinx-serialization-json",             version.ref = "serializationJson" }
hilt-android                           = { group = "com.google.dagger",          name = "hilt-android",                           version.ref = "hilt"              }
hilt-android-compiler                  = { group = "com.google.dagger",          name = "hilt-android-compiler",                  version.ref = "hilt"              }
hilt-navigation-compose                = { group = "androidx.hilt",              name = "hilt-navigation-compose",                version = "1.2.0"                 }
hilt-work                              = { group = "androidx.hilt",              name = "hilt-work",                              version = "1.2.0"                 }
hilt-work-compiler                     = { group = "androidx.hilt",              name = "hilt-compiler",                          version = "1.2.0"                 }
room-runtime                           = { group = "androidx.room",              name = "room-runtime",                           version.ref = "room"              }
room-ktx                               = { group = "androidx.room",              name = "room-ktx",                               version.ref = "room"              }
room-compiler                          = { group = "androidx.room",              name = "room-compiler",                          version.ref = "room"              }
room-paging                            = { group = "androidx.room",              name = "room-paging",                            version.ref = "room"              }
paging-runtime                         = { group = "androidx.paging",            name = "paging-runtime",                         version.ref = "paging"            }
paging-compose                         = { group = "androidx.paging",            name = "paging-compose",                         version.ref = "paging"            }
datastore-preferences                  = { group = "androidx.datastore",         name = "datastore-preferences",                  version.ref = "datastore"         }
work-runtime-ktx                       = { group = "androidx.work",              name = "work-runtime-ktx",                       version.ref = "workmanager"       }
splashscreen                           = { group = "androidx.core",              name = "core-splashscreen",                      version.ref = "splashscreen"      }
vico-compose-m3                        = { group = "com.patrykandpatrick.vico",  name = "compose-m3",                             version.ref = "vico"              }
flexible-bottomsheet-material3           = { group = "com.github.skydoves",        name = "flexible-bottomsheet-material3",         version.ref = "flexibleBottomsheet" }
compose-shimmer                    = { group = "com.valentinilk.shimmer",    name = "compose-shimmer",                        version.ref = "composeShimmer"      }
m3-adaptive-navigation-suite           = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite",    version.ref = "m3AdaptiveNavSuite"}
junit                                  = { group = "junit",                      name = "junit",                                  version.ref = "junit"             }
androidx-junit                         = { group = "androidx.test.ext",          name = "junit",                                  version.ref = "junitVersion"      }
androidx-espresso-core                 = { group = "androidx.test.espresso",     name = "espresso-core",                          version.ref = "espressoCore"      }

[plugins]
android-application  = { id = "com.android.application",                    version.ref = "agp"    }
kotlin-android       = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android",             version.ref = "hilt"   }
ksp                  = { id = "com.google.devtools.ksp",                    version.ref = "ksp"    }

